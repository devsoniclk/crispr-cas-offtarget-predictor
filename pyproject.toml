[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crispr-cas-offtarget-predictor"
version = "0.1.0"
description = "Automated SpCas9 & Cas12a Guide RNA Off-Target Cleavage & Epigenetic Chromatin Accessibility Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lakshitha Dananjaya", email = "dananjayarox01@gmail.com" }
]
keywords = [
    "crispr",
    "cas9",
    "cas12a",
    "genomics",
    "synthetic-biology",
    "cfd-score",
    "off-target",
    "bioinformatics",
    "atac-seq",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
crispr-predict = "crispr_cas_offtarget_predictor.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=crispr_cas_offtarget_predictor"
