name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret and license audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          crispr-predict --audit-file crispr_cas_offtarget_predictor/engine.py
